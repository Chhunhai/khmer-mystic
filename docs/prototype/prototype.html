<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khmer Mystic – Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Kantumruy+Pro:wght@400;500;600&family=Moul&display=swap">
<style>
:root{
  --bg:#F3EBDD; --panel:#FBF6EC; --ink:#14203D; --muted:#5A5446; --gold:#8A6A2B; --line:rgba(138,106,43,.35); --sel:rgba(138,106,43,.12);
  --card-bg:#0F1A33; --card-gold:#C9A45C; --card-ink:#F3EBDD;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A33; --panel:#132042; --ink:#F3EBDD; --muted:#B9B2A3; --gold:#C9A45C; --line:rgba(201,164,92,.35); --sel:rgba(201,164,92,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A33; --panel:#132042; --ink:#F3EBDD; --muted:#B9B2A3; --gold:#C9A45C; --line:rgba(201,164,92,.35); --sel:rgba(201,164,92,.14);
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Kantumruy Pro",system-ui,sans-serif;font-size:16px;line-height:1.55}
:lang(km){line-height:1.75}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.app{max-width:480px;margin:0 auto;padding:16px 20px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{background:none;border:0;padding:8px 4px;color:var(--gold);cursor:pointer;font-size:15px}
.back[hidden]{visibility:hidden;display:block}
.step{font-size:13px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}
h1,h2{font-family:"Cinzel",Georgia,serif;font-weight:700;color:var(--gold);margin:0}
:lang(km) h2{font-family:"Moul","Kantumruy Pro",serif;font-weight:400;font-size:20px;line-height:1.8}
h2{font-size:24px;letter-spacing:.02em;margin-top:12px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 18px}
/* welcome */
.hero{text-align:center;padding:36px 0 8px}
.hero h1{font-size:44px;line-height:1.05;letter-spacing:.03em}
.hero .tag{margin:12px 0 28px;color:var(--muted)}
.hero .lotus{width:72px;height:auto;margin:0 auto 18px;display:block}
.primary{display:block;width:100%;padding:15px 20px;border-radius:999px;border:0;background:var(--gold);color:var(--bg);font-weight:600;font-size:17px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.ghost{display:block;width:100%;padding:13px 20px;border-radius:999px;border:1px solid var(--gold);background:none;color:var(--gold);font-weight:600;cursor:pointer;margin-top:12px}
.langpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 28px}
.langpick button{padding:18px 8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;font-size:18px}
.langpick button[aria-pressed="true"]{border-color:var(--gold);background:var(--sel);font-weight:600}
.label{font-size:14px;color:var(--muted);margin-bottom:8px}
/* zodiac */
.zgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.zgrid button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.zgrid .em{font-size:30px;line-height:1.2}
.zgrid .n{font-weight:600;font-size:15px}
.zgrid .s{font-size:12px;color:var(--muted)}
.zgrid button[aria-pressed="true"]{border-color:var(--gold);background:var(--sel)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.list button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.list button[aria-pressed="true"]{border-color:var(--gold);background:var(--sel)}
.list .sub{font-size:13px;color:var(--muted)}
.chev{color:var(--gold)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgrid button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 10px;cursor:pointer;text-align:center}
.tgrid button[aria-pressed="true"]{border-color:var(--gold);background:var(--sel)}
.tgrid .n{font-weight:600}
.tgrid .s{font-size:13px;color:var(--muted)}
.foot{margin-top:24px}
/* cards */
.deck{position:relative;height:200px;margin:12px auto 20px;width:130px}
.deck .cb{position:absolute;inset:0;transition:transform .5s ease}
.deck.shuffle .cb:nth-child(1){animation:sh1 .9s ease}
.deck.shuffle .cb:nth-child(2){animation:sh2 .9s ease}
.deck.shuffle .cb:nth-child(3){animation:sh3 .9s ease}
@keyframes sh1{30%{transform:translateX(-46px) rotate(-8deg)}60%{transform:translateX(30px) rotate(5deg)}}
@keyframes sh2{30%{transform:translateX(46px) rotate(8deg)}60%{transform:translateX(-30px) rotate(-5deg)}}
@keyframes sh3{50%{transform:translateY(-14px)}}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.slot .pos{font-size:13px;color:var(--muted);text-align:center}
.flip{width:100%;aspect-ratio:7/12;perspective:900px;background:none;border:0;padding:0;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip:disabled{cursor:default}
.cb,.cf{width:100%;height:100%;border-radius:10px;background:var(--card-bg);border:1.5px solid var(--card-gold);position:relative;overflow:hidden}
.cb svg{width:100%;height:100%;display:block}
.cf{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10% 6% 9%;color:var(--card-ink);text-align:center}
.cf::before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,164,92,.55);border-radius:7px;pointer-events:none}
.cf .num{font-family:"Cinzel",Georgia,serif;font-weight:700;color:var(--card-gold);font-size:13px}
.cf svg{width:62%;height:auto}
.cf .nm{font-family:"Cinzel",Georgia,serif;font-weight:700;color:var(--card-gold);font-size:12px;line-height:1.2}
:lang(km) .cf .nm{font-family:"Kantumruy Pro",sans-serif;font-weight:600;font-size:13px;line-height:1.5}
.tapnote{text-align:center;color:var(--muted);font-size:14px;margin:16px 0 0;min-height:22px}
/* reading */
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 8px}
.mini .cf{aspect-ratio:7/12;height:auto}
.mini .pos{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.reading p{margin:0 0 14px}
.reading .lead{font-size:17px}
.reading .cardp b{color:var(--gold)}
.reading .theme{border-left:2px solid var(--gold);padding-left:14px}
.disc{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.proto{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
@media (prefers-reduced-motion: reduce){
  .flip .inner{transition:none}
  .deck.shuffle .cb{animation:none !important}
}
</style>
</head>

 ["The High Priestess","ព្រាហ្មណីកំពូល","II","S","Your inner voice knows more than you admit; listen in stillness.","Not everything is visible yet; avoid deciding before the truth appears.","Hidden answers come to light and guide you well.","សំឡេងក្នុងចិត្តរបស់អ្នកដឹងច្រើនជាងអ្វីដែលអ្នកទទួលស្គាល់។ សូមស្តាប់វានៅពេលស្ងប់ស្ងាត់។","មិនមែនអ្វីៗទាំងអស់សុទ្ធតែច្បាស់នៅឡើយទេ។ សូមកុំសម្រេចចិត្តមុនពេលការពិតលេចចេញ។","ចម្លើយដែលលាក់កំបាំងនឹងលេចចេញ ហើយណែនាំអ្នកបានល្អ។"],
 ["The Empress","ព្រះមហាក្សត្រិយានី","III","B","Your life is in a fertile season; what you nurture is growing.","Giving too much to others can drain you; care for yourself too.","Patience brings comfort, beauty and a rich harvest.","ជីវិតអ្នកស្ថិតក្នុងរដូវដ៏សម្បូរ។ អ្វីដែលអ្នកថែរក្សាកំពុងលូតលាស់។","ការផ្តល់ឱ្យអ្នកដទៃច្រើនពេកអាចធ្វើឱ្យអ្នកអស់កម្លាំង។ សូមថែរក្សាខ្លួនឯងផងដែរ។","ការអត់ធ្មត់នឹងនាំមកនូវភាពសុខស្រួល សម្រស់ និងផលដ៏បរិបូរណ៍។"],
 ["The Emperor","ព្រះចក្រពត្តិ","IV","S","Order and steady leadership are needed now; take charge calmly.","Rigid control can push people away; lead with fairness.","A strong, stable foundation supports long-term success.","ពេលនេះត្រូវការសណ្តាប់ធ្នាប់ និងការដឹកនាំដ៏ខ្ជាប់ខ្ជួន។ សូមដឹកនាំដោយស្ងប់ស្ងាត់។","ការគ្រប់គ្រងតឹងរ៉ឹងពេកអាចធ្វើឱ្យមនុស្សឃ្លាតឆ្ងាយ។ សូមដឹកនាំដោយយុត្តិធម៌។","មូលដ្ឋានដ៏រឹងមាំ និងស្ថិរភាព នឹងគាំទ្រភាពជោគជ័យរយៈពេលវែង។"],
 ["The Hierophant","គ្រូអាចារ្យ","V","S","Respected teachers, customs and proven paths can guide you now.","Following rules blindly may hold you back; keep what still serves you.","Wise advice and shared values bring security and belonging.","គ្រូដែលគួរគោរព ទំនៀមទម្លាប់ និងផ្លូវដែលបានបញ្ជាក់ហើយ អាចណែនាំអ្នកនៅពេលនេះ។","ការធ្វើតាមច្បាប់ដោយមិនគិតអាចរារាំងអ្នក។ សូមរក្សាទុកតែអ្វីដែលនៅមានប្រយោជន៍។","ដំបូន្មានដ៏ឈ្លាសវៃ និងគុណតម្លៃរួម នាំមកនូវសុវត្ថិភាព និងការរួបរួម។"],
 ["The Lovers","គូស្នេហ៍","VI","B","An important bond or choice is at the heart of your situation.","Mixed feelings or values create doubt; choose what is true to your heart.","Honest choices bring harmony and deeper connection.","ចំណងទាក់ទង ឬជម្រើសដ៏សំខាន់មួយ ស្ថិតនៅចំកណ្តាលស្ថានភាពរបស់អ្នក។","អារម្មណ៍ ឬគុណតម្លៃខុសគ្នាបង្កើតការសង្ស័យ។ សូមជ្រើសរើសអ្វីដែលស្មោះត្រង់នឹងចិត្តអ្នក។","ជម្រើសដ៏ស្មោះត្រង់នាំមកនូវភាពសុខដុម និងទំនាក់ទំនងកាន់តែជ្រាលជ្រៅ។"],
 ["The Chariot","រថសេះ","VII","B","You are moving forward with determination; keep your direction clear.","Opposing pulls can stall you; unite your thoughts and actions.","Focused effort carries you to a well-earned success.","អ្នកកំពុងឆ្ពោះទៅមុខដោយការតាំងចិត្ត។ សូមរក្សាទិសដៅឱ្យច្បាស់។","ការទាញទៅទិសផ្ទុយគ្នាអាចធ្វើឱ្យអ្នកជាប់គាំង។ សូមរួបរួមគំនិត និងសកម្មភាពរបស់អ្នក។","ការខិតខំដោយផ្តោតអារម្មណ៍ នាំអ្នកទៅរកភាពជោគជ័យដែលសមនឹងទទួលបាន។"],
 ["Strength","កម្លាំង","VIII","B","Quiet courage and kindness are your greatest power now.","Frustration may tempt you to force things; gentle persistence works better.","Calm confidence helps you overcome what once seemed hard.","ភាពក្លាហានដ៏ស្ងប់ស្ងាត់ និងសេចក្តីសប្បុរស គឺជាកម្លាំងដ៏ធំបំផុតរបស់អ្នកនៅពេលនេះ។","ការខកចិត្តអាចល្បួងឱ្យអ្នកបង្ខំ។ ការតស៊ូដោយទន់ភ្លន់មានប្រសិទ្ធភាពជាង។","ទំនុកចិត្តដ៏ស្ងប់ស្ងាត់ជួយអ្នកឱ្យជម្នះអ្វីដែលធ្លាប់មើលទៅពិបាក។"],
 ["The Hermit","ឥសី","IX","S","This is a time to step back, reflect and seek your own answers.","Too much withdrawal can leave you isolated; share your light when ready.","Inner wisdom shows you the right path forward.","នេះជាពេលត្រូវដកខ្លួនបន្តិច ពិចារណា និងស្វែងរកចម្លើយដោយខ្លួនឯង។","ការដកខ្លួនច្រើនពេកអាចធ្វើឱ្យអ្នកឯកោ។ សូមចែករំលែកពន្លឺរបស់អ្នកនៅពេលរួចរាល់។","ប្រាជ្ញាខាងក្នុងបង្ហាញអ្នកនូវផ្លូវត្រឹមត្រូវទៅមុខ។"],
 ["Wheel of Fortune","កង់វាសនា","X","B","Life is turning; circumstances are shifting around you.","You cannot control every change; adapt instead of resisting.","A new cycle brings fresh luck and opportunity.","ជីវិតកំពុងវិល។ កាលៈទេសៈនៅជុំវិញអ្នកកំពុងប្រែប្រួល។","អ្នកមិនអាចគ្រប់គ្រងរាល់ការផ្លាស់ប្តូរបានទេ។ សូមសម្របខ្លួនជំនួសឱ្យការប្រឆាំង។","វដ្តថ្មីនាំមកនូវសំណាង និងឱកាសថ្មី។"],
 ["Justice","យុត្តិធម៌","XI","S","Fair decisions and honest dealings matter most right now.","Imbalance or one-sided thinking causes trouble; weigh all sides.","Truth and fairness lead to a balanced, deserved result.","ការសម្រេចចិត្តដោយយុត្តិធម៌ និងភាពស្មោះត្រង់ សំខាន់បំផុតនៅពេលនេះ។","ភាពមិនស្មើគ្នា ឬការគិតតែម្ខាង បង្កបញ្ហា។ សូមថ្លឹងថ្លែងគ្រប់ជ្រុង។","ការពិត និងយុត្តិធម៌ នាំទៅរកលទ្ធផលដែលមានតុល្យភាព និងសមរម្យ។"],
 ["The Hanged Man","បុរសព្យួរ","XII","T","Things feel on hold; a pause is giving you a new view.","Struggling against delay only tires you; let go and look differently.","A fresh perspective reveals a better way forward.","អ្វីៗហាក់ដូចជាផ្អាក។ ការផ្អាកនេះកំពុងផ្តល់ឱ្យអ្នកនូវទស្សនៈថ្មី។","ការតស៊ូប្រឆាំងនឹងការពន្យារពេលធ្វើឱ្យអ្នកហត់នឿយ។ សូមលែងប្រកាន់ ហើយមើលពីជ្រុងផ្សេង។","ទស្សនៈថ្មីបង្ហាញផ្លូវដ៏ល្អប្រសើរជាងមុន។"],
 ["Death","មរណៈ","XIII","S","One chapter is closing so another can begin.","Holding on to what has ended blocks your growth; release it gently.","Real transformation clears space for a renewed life.","ជំពូកមួយកំពុងបិទ ដើម្បីឱ្យជំពូកថ្មីចាប់ផ្តើម។","ការប្រកាន់ខ្ជាប់អ្វីដែលបានបញ្ចប់ រារាំងការរីកចម្រើន។ សូមលែងវាដោយទន់ភ្លន់។","ការផ្លាស់ប្តូរពិតប្រាកដ បើកលំហសម្រាប់ជីវិតថ្មី។"],
 ["Temperance","តុល្យភាព","XIV","B","Balance and patience are bringing things into harmony.","Extremes or haste upset your progress; find the middle way.","Steady moderation brings peace and lasting improvement.","តុល្យភាព និងការអត់ធ្មត់ កំពុងនាំអ្វីៗឱ្យចុះសម្រុងគ្នា។","ភាពជ្រុល ឬការប្រញាប់ ធ្វើឱ្យដំណើររបស់អ្នករាំងស្ទះ។ សូមរកផ្លូវកណ្តាល។","ភាពល្មមល្មើយជាប់លាប់ នាំមកនូវសន្តិភាព និងភាពប្រសើរឡើងយូរអង្វែង។"],
 ["The Devil","យក្ស","XV","T","Something may be holding you more tightly than you realize.","Habits or fears keep you stuck; the chains are looser than they seem.","Breaking free from what limits you brings new freedom.","អ្វីមួយប្រហែលជាកំពុងចងអ្នកតឹងជាងអ្វីដែលអ្នកដឹង។","ទម្លាប់ ឬការភ័យខ្លាច ធ្វើឱ្យអ្នកជាប់គាំង។ ច្រវាក់នោះធូរជាងអ្វីដែលអ្នកគិត។","ការរំដោះខ្លួនពីអ្វីដែលកំណត់អ្នក នាំមកនូវសេរីភាពថ្មី។"],
 ["The Tower","ប្រាង្គ","XVI","T","Unexpected change is shaking up your plans.","Clinging to what is falling makes it harder; let weak structures go.","After the shake-up, you can rebuild on a stronger foundation.","ការផ្លាស់ប្តូរដែលមិនបានរំពឹងទុក កំពុងរង្គើផែនការរបស់អ្នក។","ការតោងអ្វីដែលកំពុងដួលរលំ ធ្វើឱ្យកាន់តែពិបាក។ សូមលែងរចនាសម្ព័ន្ធដែលខ្សោយ។","ក្រោយការរង្គើ អ្នកអាចសាងសង់ឡើងវិញលើមូលដ្ឋានដ៏រឹងមាំជាងមុន។"],
 ["The Star","ផ្កាយ","XVII","B","Hope is returning; you are healing and finding new faith.","Doubt may dim your light; keep believing in your direction.","Renewal and inspiration bring a brighter, calmer future.","ក្តីសង្ឃឹមកំពុងត្រឡប់មកវិញ។ អ្នកកំពុងជាសះស្បើយ និងរកឃើញជំនឿថ្មី។","ការសង្ស័យអាចធ្វើឱ្យពន្លឺរបស់អ្នកស្រអាប់។ សូមបន្តជឿលើទិសដៅរបស់អ្នក។","ការកើតជាថ្មី និងការបំផុសគំនិត នាំមកនូវអនាគតភ្លឺស្វាង និងស្ងប់ស្ងាត់។"],

  ["You may feel bored or unsatisfied with what you have.","Looking inward too long can make you miss a good offer; look up.","A new opportunity renews your interest.","អ្នកប្រហែលជាធុញទ្រាន់ ឬមិនពេញចិត្តនឹងអ្វីដែលមាន។","ការសម្លឹងតែក្នុងចិត្តយូរពេក អាចធ្វើឱ្យរំលងឱកាសល្អ។ សូមងើបមុខមើល។","ឱកាសថ្មីមួយនឹងធ្វើឱ្យអ្នកចាប់អារម្មណ៍ឡើងវិញ។"],
  ["You are focusing on something that did not work out.","Dwelling on loss hides what remains; turn toward what is still good.","Accepting the past lets you find comfort and move on.","អ្នកកំពុងផ្តោតលើអ្វីមួយដែលមិនបានសម្រេច។","ការគិតតែពីការបាត់បង់ បិទបាំងអ្វីដែលនៅសល់។ សូមបែរទៅរកអ្វីដែលនៅល្អ។","ការទទួលយកអតីតកាល ជួយឱ្យអ្នករកឃើញភាពធូរចិត្ត ហើយបន្តទៅមុខ។"],
  ["Sweet memories or old connections are on your mind.","Living in the past can stop you growing; take its lessons forward.","Kindness and familiar people bring you comfort.","អនុស្សាវរីយ៍ដ៏ផ្អែមល្ហែម ឬទំនាក់ទំនងចាស់ៗ កំពុងនៅក្នុងគំនិតអ្នក។","ការរស់នៅក្នុងអតីតកាលអាចរារាំងការរីកចម្រើន។ សូមយកមេរៀនរបស់វាទៅមុខ។","ចិត្តល្អ និងមនុស្សដែលធ្លាប់ស្គាល់ នាំមកនូវភាពកក់ក្តៅ។"],
  ["Many options and dreams are in front of you.","Wishful thinking can cloud judgment; check what is real.","Focusing on one realistic choice brings clarity.","ជម្រើស និងក្តីសុបិនជាច្រើនកំពុងនៅចំពោះមុខអ្នក។","ការគិតតាមចិត្តប្រាថ្នាអាចធ្វើឱ្យវិនិច្ឆ័យខុស។ សូមពិនិត្យថាអ្វីជាការពិត។","ការផ្តោតលើជម្រើសមួយដែលអាចធ្វើបាន នាំមកនូវភាពច្បាស់លាស់។"],
  ["Part of you is ready to leave something behind.","Walking away is hard; trust that you are seeking something better.","A more meaningful path awaits you.","ផ្នែកមួយនៃចិត្តអ្នក ត្រៀមខ្លួនចាកចេញពីអ្វីមួយ។","ការចាកចេញពិបាក។ សូមជឿថាអ្នកកំពុងស្វែងរកអ្វីដែលល្អជាង។","ផ្លូវដែលមានអត្ថន័យជាងមុនកំពុងរង់ចាំអ្នក។"],
  ["You feel satisfied, or close to a wish coming true.","Comfort can turn into complacency; stay grateful and humble.","A heartfelt wish is likely to be fulfilled.","អ្នកមានអារម្មណ៍ពេញចិត្ត ឬជិតសម្រេចក្តីប្រាថ្នាហើយ។","ភាពសុខស្រួលអាចប្រែជាការធ្វេសប្រហែស។ សូមរក្សាការដឹងគុណ និងការរាបទាប។","ក្តីប្រាថ្នាពីចិត្តមួយ ទំនងជានឹងបានសម្រេច។"],
  ["Love and harmony with those close to you are strong.","Expecting perfection can create pressure; enjoy what is already good.","Lasting happiness and peace at home are likely.","សេចក្តីស្រឡាញ់ និងភាពសុខដុមជាមួយអ្នកជិតស្និទ្ធ កំពុងរឹងមាំ។","ការរំពឹងភាពល្អឥតខ្ចោះអាចបង្កសម្ពាធ។ សូមរីករាយនឹងអ្វីដែលល្អស្រាប់។","សុភមង្គលយូរអង្វែង និងសន្តិភាពក្នុងផ្ទះ ទំនងជានឹងកើតមាន។"],
  ["A gentle, creative message or feeling is arriving.","Being too sensitive can hurt you; trust your feelings without fear.","A pleasant surprise or kind message is on its way.","សារ ឬអារម្មណ៍ដ៏ទន់ភ្លន់ និងច្នៃប្រឌិតមួយ កំពុងមកដល់។","ការរសើបពេកអាចធ្វើឱ្យអ្នកឈឺចាប់។ សូមទុកចិត្តលើអារម្មណ៍ដោយមិនខ្លាច។","ការភ្ញាក់ផ្អើលដ៏រីករាយ ឬសារល្អមួយ កំពុងមកដល់។"],
  ["You are following your heart toward something beautiful.","Idealism can hide practical issues; keep one foot on the ground.","A heartfelt offer or invitation is likely.","អ្នកកំពុងធ្វើតាមចិត្ត ឆ្ពោះទៅរកអ្វីដ៏ស្រស់ស្អាត។","ឧត្តមគតិនិយមអាចបិទបាំងបញ្ហាជាក់ស្តែង។ សូមរក្សាជើងមួយនៅលើដី។","ការផ្តល់ជូន ឬការអញ្ជើញពីចិត្ត ទំនងជានឹងមកដល់។"],
  ["Your compassion and intuition are strong now.","Absorbing others’ feelings can drain you; protect your own energy.","Emotional wisdom helps you and others heal.","ក្តីមេត្តា និងវិចារណញាណរបស់អ្នក រឹងមាំនៅពេលនេះ។","ការស្រូបយកអារម្មណ៍អ្នកដទៃអាចធ្វើឱ្យអ្នកអស់កម្លាំង។ សូមការពារថាមពលខ្លួនឯង។","ប្រាជ្ញាផ្នែកអារម្មណ៍ ជួយអ្នក និងអ្នកដទៃឱ្យជាសះស្បើយ។"],
  ["You are handling feelings with calm and maturity.","Hiding your feelings too well can create distance; share honestly.","Calm wisdom brings peace and respect.","អ្នកកំពុងដោះស្រាយអារម្មណ៍ដោយភាពស្ងប់ និងចាស់ទុំ។","ការលាក់អារម្មណ៍ពេកអាចបង្កើតគម្លាត។ សូមចែករំលែកដោយស្មោះត្រង់។","ប្រាជ្ញាដ៏ស្ងប់ស្ងាត់ នាំមកនូវសន្តិភាព និងការគោរព។"]]},
 SWO:{en:"Swords",km:"ដាវ",B:[1],T:[2,3,5,7,8,9,10],m:[
  ["A clear idea or truth is cutting through confusion.","Sharp words can hurt; speak the truth with care.","A breakthrough brings clear understanding.","គំនិត ឬការពិតដ៏ច្បាស់មួយ កំពុងកាត់ផ្តាច់ភាពច្របូកច្របល់។","ពាក្យសម្តីមុតស្រួចអាចធ្វើឱ្យឈឺចិត្ត។ សូមនិយាយការពិតដោយយកចិត្តទុកដាក់។","ការរកឃើញថ្មី នាំមកនូវការយល់ដឹងច្បាស់លាស់។"],
  ["You are stuck between two options.","Avoiding the choice keeps you stuck; gather the facts and decide.","A balanced decision ends the stalemate.","អ្នកកំពុងជាប់គាំងរវាងជម្រើសពីរ។","ការគេចវេះការសម្រេចចិត្ត ធ្វើឱ្យអ្នកនៅតែជាប់គាំង។ សូមប្រមូលការពិត ហើយសម្រេចចិត្ត។","ការសម្រេចចិត្តដោយតុល្យភាព បញ្ចប់ភាពជាប់គាំង។"],
  ["Something has caused you sadness or disappointment.","Holding the pain inside makes it heavier; allow yourself to feel and heal.","Healing comes after the hurt is released.","អ្វីមួយបានធ្វើឱ្យអ្នកសោកសៅ ឬខកចិត្ត។","ការទប់ការឈឺចាប់ទុកក្នុងចិត្ត ធ្វើឱ្យវាកាន់តែធ្ងន់។ សូមអនុញ្ញាតឱ្យខ្លួនឯងមានអារម្មណ៍ ហើយជាសះស្បើយ។","ការជាសះស្បើយមកដល់ ក្រោយពីការឈឺចាប់ត្រូវបានដោះលែង។"],
  ["You need rest and quiet to recover your strength.","Pushing on without rest leads to burnout; take a pause.","Recovered energy brings a clearer mind.","អ្នកត្រូវការការសម្រាក និងភាពស្ងប់ស្ងាត់ ដើម្បីស្តារកម្លាំងឡើងវិញ។","ការបន្តដោយមិនសម្រាក នាំឱ្យអស់កម្លាំង។ សូមផ្អាកមួយរយៈ។","កម្លាំងដែលបានស្តារឡើងវិញ នាំមកនូវគំនិតច្បាស់លាស់។"],
  ["A conflict leaves winners and losers.","Winning an argument can cost a relationship; choose peace over pride.","Letting go of the fight brings relief.","ជម្លោះមួយបន្សល់ទុកអ្នកឈ្នះ និងអ្នកចាញ់។","ការឈ្នះការឈ្លោះប្រកែក អាចធ្វើឱ្យបាត់បង់ទំនាក់ទំនង។ សូមជ្រើសរើសសន្តិភាពជាងមោទនភាព។","ការលែងតស៊ូ នាំមកនូវភាពធូរស្រាល។"],
  ["You are moving away from difficulty toward calmer times.","Leaving the familiar feels sad; trust the journey.","Calmer, more peaceful days are ahead.","អ្នកកំពុងចាកចេញពីការលំបាក ឆ្ពោះទៅរកពេលវេលាស្ងប់ស្ងាត់ជាងមុន។","ការចាកចេញពីអ្វីដែលធ្លាប់ស្គាល់ គួរឱ្យសោកសៅ។ សូមទុកចិត្តលើដំណើរនេះ។","ថ្ងៃដ៏ស្ងប់ស្ងាត់ និងសុខសាន្តជាងមុន កំពុងរង់ចាំ។"],
  ["Strategy and careful planning matter now.","Shortcuts or hidden motives can backfire; act honestly.","Clever, honest planning gets you through.","យុទ្ធសាស្ត្រ និងការរៀបចំផែនការយ៉ាងប្រុងប្រយ័ត្ន សំខាន់នៅពេលនេះ។","ផ្លូវកាត់ ឬចេតនាលាក់កំបាំង អាចផ្តល់ផលអាក្រក់មកវិញ។ សូមធ្វើដោយស្មោះត្រង់។","ផែនការដ៏ឆ្លាតវៃ និងស្មោះត្រង់ នាំអ្នកឆ្លងផុត។"],
  ["You may feel restricted with no way out.","The limits are partly in your mind; take one small step.","You discover you are freer than you thought.","អ្នកប្រហែលជាមានអារម្មណ៍ថាជាប់គាំង ហើយគ្មានផ្លូវចេញ។","ដែនកំណត់មួយផ្នែកស្ថិតនៅក្នុងគំនិតរបស់អ្នក។ សូមបោះជំហានតូចមួយ។","អ្នករកឃើញថាអ្នកមានសេរីភាពច្រើនជាងអ្វីដែលអ្នកគិត។"],
  ["Worries may be weighing heavily on your mind.","Fears grow larger at night; talk to someone you trust.","Your worries ease as you see things more clearly.","ការព្រួយបារម្ភប្រហែលជាកំពុងសង្កត់លើគំនិតអ្នកយ៉ាងធ្ងន់។","ការភ័យខ្លាចកាន់តែធំនៅពេលយប់។ សូមនិយាយជាមួយអ្នកដែលអ្នកទុកចិត្ត។","ការព្រួយបារម្ភរបស់អ្នកធូរស្រាល នៅពេលអ្នកមើលឃើញអ្វីៗកាន់តែច្បាស់។"],

  pre:["{card1} shows where you stand: {present}","In the Present position, {card1} says: {present}"],
  cha:["{card2} names your challenge: {challenge}","The challenge comes from {card2}: {challenge}"],
  out:["{card3} shows where things are heading {time}: {outcome}","{card3} shows where things are heading {time}: {outcome}"],
  adv:["A word for the {animal}: {advice}","Remember, {animal}: {advice}"],
  theme:{MAJ:"Two or more Major cards appeared, so this is an important period with lessons that will matter for a long time.",WAN:"Your cards lean toward Wands: energy, ambition and action are the heart of this reading.",CUP:"Your cards lean toward Cups: feelings and relationships are the heart of this reading.",SWO:"Your cards lean toward Swords: thoughts, choices and clear communication are the heart of this reading.",PEN:"Your cards lean toward Pentacles: practical matters like work, money and daily life are the heart of this reading.",MIX:"Your cards come from different areas of life, so several parts of your situation are connected."},
  tone:{B:"The outlook is bright; keep going with confidence.",S:"The path ahead is steady; patient effort will shape the result.",T:"The path asks for care, but every difficulty here carries a lesson that makes you stronger."},
  disc:"This reading is for reflection and entertainment. For important decisions about health, money or the law, please talk to a qualified professional."},
 km:{open:["អ្នកបានសួរថា «{question}» នេះជាអ្វីដែលសន្លឹកបៀបង្ហាញអំពី{focus} {time}។","សំណួររបស់អ្នកគឺ «{question}» តោះមើល{focus} {time}។"],
  str:["អ្នកកើតឆ្នាំ{animal}៖ {strength}","ចរិតឆ្នាំ{animal}របស់អ្នកលេចធ្លោនៅទីនេះ។ {strength}"],
  pre:["{card1} បង្ហាញពីស្ថានភាពបច្ចុប្បន្នរបស់អ្នក៖ {present}","នៅទីតាំងបច្ចុប្បន្ន {card1} ប្រាប់ថា៖ {present}"],
  cha:["{card2} បង្ហាញពីបញ្ហាប្រឈមរបស់អ្នក៖ {challenge}","បញ្ហាប្រឈមមកពី {card2}៖ {challenge}"],
  out:["{card3} បង្ហាញពីទិសដៅដែលអ្វីៗកំពុងឆ្ពោះទៅ {time}៖ {outcome}","{card3} បង្ហាញពីទិសដៅដែលអ្វីៗកំពុងឆ្ពោះទៅ {time}៖ {outcome}"],
  adv:["ពាក្យណែនាំសម្រាប់អ្នកឆ្នាំ{animal}៖ {advice}","សូមចងចាំ អ្នកឆ្នាំ{animal}៖ {advice}"],
  theme:{MAJ:"មានសន្លឹកធំពីរ ឬច្រើនជាងនេះ ដូច្នេះនេះជារយៈពេលសំខាន់ ដែលមានមេរៀនមានតម្លៃយូរអង្វែង។",WAN:"សន្លឹកបៀរបស់អ្នកភាគច្រើនជាដំបង៖ ថាមពល មហិច្ឆតា និងសកម្មភាព ជាស្នូលនៃការទស្សន៍ទាយនេះ។",CUP:"សន្លឹកបៀរបស់អ្នកភាគច្រើនជាផ្តិល៖ អារម្មណ៍ និងទំនាក់ទំនង ជាស្នូលនៃការទស្សន៍ទាយនេះ។",SWO:"សន្លឹកបៀរបស់អ្នកភាគច្រើនជាដាវ៖ គំនិត ជម្រើស និងការប្រាស្រ័យទាក់ទងច្បាស់លាស់ ជាស្នូលនៃការទស្សន៍ទាយនេះ។",PEN:"សន្លឹកបៀរបស់អ្នកភាគច្រើនជាកាក់៖ រឿងជាក់ស្តែងដូចជា ការងារ លុយកាក់ និងជីវិតប្រចាំថ្ងៃ ជាស្នូលនៃការទស្សន៍ទាយនេះ។",MIX:"សន្លឹកបៀរបស់អ្នកមកពីផ្នែកផ្សេងៗនៃជីវិត ដូច្នេះផ្នែកជាច្រើននៃស្ថានភាពរបស់អ្នកមានទំនាក់ទំនងគ្នា។"},
  tone:{B:"ទិដ្ឋភាពខាងមុខភ្លឺស្វាង។ សូមបន្តទៅមុខដោយទំនុកចិត្ត។",S:"ផ្លូវខាងមុខមានស្ថិរភាព។ ការខិតខំដោយអត់ធ្មត់នឹងកំណត់លទ្ធផល។",T:"ផ្លូវនេះទាមទារការប្រុងប្រយ័ត្ន ប៉ុន្តែរាល់ការលំបាកនៅទីនេះ មានមេរៀនដែលធ្វើឱ្យអ្នករឹងមាំជាងមុន។"},
  disc:"ការទស្សន៍ទាយនេះសម្រាប់ការពិចារណា និងការកម្សាន្តប៉ុណ្ណោះ។ សម្រាប់ការសម្រេចចិត្តសំខាន់ៗទាក់ទងនឹងសុខភាព លុយកាក់ ឬច្បាប់ សូមពិគ្រោះជាមួយអ្នកជំនាញ។"}
};

/* ---------- helpers ---------- */
function kn(n){return String(n).replace(/\d/g,d=>"០១២៣៤៥៦៧៨៩"[d]);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fill(t,v){return t.replace(/\{(\w+)\}/g,(_,k)=>v[k]!==undefined?v[k]:"");}
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h;}

const S={lang:"en",step:0,z:null,topic:null,q:null,time:null,cards:null,flipped:[false,false,false],shuffled:false};
try{const l=localStorage.getItem("km-lang");if(l==="en"||l==="km")S.lang=l;}catch(e){}

function cardName(c){return S.lang==="km"?c.km:c.en;}

function buildReading(){
 const L=S.lang,T=TPL[L],z=ZOD[S.z],tp=TOPICS[S.topic],c=S.cards;
 const seed=fnv([z[0],tp.id+"-"+String(S.q+1).padStart(2,"0"),S.time,c[0].id,c[1].id,c[2].id].join("|"));
 const v=i=>(seed>>i)&1;
 const vals={question:L==="km"?tp.q[S.q][1]:tp.q[S.q][0],focus:L==="km"?tp.fk:tp.fe,time:TIME[L][S.time],
  animal:L==="km"?z[2]:z[1],strength:L==="km"?z[6]:z[4],advice:L==="km"?z[7]:z[5],
  card1:"<b>"+esc(cardName(c[0]))+"</b>",card2:"<b>"+esc(cardName(c[1]))+"</b>",card3:"<b>"+esc(cardName(c[2]))+"</b>",
  present:c[0].m[L][0],challenge:c[1].m[L][1],outcome:c[2].m[L][2]};
 ["question","focus","time","animal","strength","advice","present","challenge","outcome"].forEach(k=>vals[k]=esc(vals[k]));
 const majors=c.filter(x=>x.major).length;let th="MIX";
 if(majors>=2)th="MAJ";else{const cnt={};c.forEach(x=>{if(x.suit)cnt[x.suit]=(cnt[x.suit]||0)+1;});for(const k in cnt)if(cnt[k]>=2)th=k;}
 return {open:fill(T.open[v(0)],vals),str:fill(T.str[v(1)],vals),pre:fill(T.pre[v(2)],vals),cha:fill(T.cha[v(3)],vals),out:fill(T.out[0],vals),
  theme:esc(T.theme[th]+" "+T.tone[c[2].tag]),adv:fill(T.adv[v(4)],vals),close:esc(L==="km"?tp.ck:tp.ce),disc:esc(T.disc)};
}

/* ---------- art ---------- */
const LOTUS=`<svg class="lotus" viewBox="0 0 120 80" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--gold)"><path d="M60 70C48 56 48 34 60 14C72 34 72 56 60 70Z"/><path d="M60 70C44 64 32 48 30 28C46 34 56 50 60 70Z"/><path d="M60 70C76 64 88 48 90 28C74 34 64 50 60 70Z"/><path d="M60 70C40 72 22 62 12 46C32 44 50 56 60 70Z"/><path d="M60 70C80 72 98 62 108 46C88 44 70 56 60 70Z"/></svg>`;
const BACK=`<svg viewBox="0 0 70 120" aria-hidden="true"><rect x="5" y="5" width="60" height="110" rx="4" fill="none" stroke="#C9A45C" stroke-width=".8" opacity=".6"/><g transform="translate(35 60)" fill="#C9A45C"><circle r="23" fill="none" stroke="#C9A45C" stroke-width="1"/>${[0,45,90,135,180,225,270,315].map(a=>`<path transform="rotate(${a}) translate(0 -5)" d="M0 0C4 -5 4 -12 0 -17C-4 -12 -4 -5 0 0Z"/>`).join("")}<circle r="4" fill="#0F1A33" stroke="#C9A45C" stroke-width="1"/></g><path d="M35 14l3 6-3 6-3-6z M35 94l3 6-3 6-3-6z" fill="#C9A45C"/></svg>`;
const EMB={
 MAJ:`<svg viewBox="0 0 60 60" aria-hidden="true" fill="#C9A45C"><path d="M30 6l4 18 18-4-14 10 14 10-18-4-4 18-4-18-18 4 14-10L8 20l18 4z"/><circle cx="30" cy="30" r="5" fill="#0F1A33"/></svg>`,
 WAN:`<svg viewBox="0 0 60 60" aria-hidden="true" fill="none" stroke="#C9A45C" stroke-width="2.4" stroke-linecap="round"><path d="M30 54V10"/><path d="M30 20c6-4 10-4 12-10M30 28c-6-4-10-4-12-10M30 36c6-3 9-2 11-7" stroke-width="1.6"/></svg>`,
 CUP:`<svg viewBox="0 0 60 60" aria-hidden="true" fill="none" stroke="#C9A45C" stroke-width="2.2" stroke-linejoin="round"><path d="M12 22h36c0 12-8 20-18 20S12 34 12 22z"/><path d="M24 42l-2 8h16l-2-8"/><path d="M18 22c2-6 8-9 12-9s10 3 12 9" stroke-width="1.4"/></svg>`,
 SWO:`<svg viewBox="0 0 60 60" aria-hidden="true" fill="none" stroke="#C9A45C" stroke-width="2.2" stroke-linecap="round"><path d="M30 6c3 6 3 24 0 34c-3-10-3-28 0-34z" fill="#C9A45C" fill-opacity=".25"/><path d="M20 42h20M30 42v10"/><circle cx="30" cy="54" r="2" fill="#C9A45C"/></svg>`,
 PEN:`<svg viewBox="0 0 60 60" aria-hidden="true" fill="none" stroke="#C9A45C" stroke-width="2"><circle cx="30" cy="30" r="22"/><circle cx="30" cy="30" r="17" stroke-width="1"/><path d="M30 42c-6-6-6-14 0-20c6 6 6 14 0 20zM30 42c-8-1-12-6-13-12c7 0 11 5 13 12zM30 42c8-1 12-6 13-12c-7 0-11 5-13 12z" fill="#C9A45C" fill-opacity=".3"/></svg>`
};
function face(c){
 const top=c.major?c.num:"";
 return `<div class="cf" lang="${S.lang==="km"?"km":"en"}"><span class="num">${esc(top)}</span>${EMB[c.major?"MAJ":c.suit]}<span class="nm">${esc(cardName(c))}</span></div>`;
}

/* ---------- render ---------- */
const app=document.getElementById("app");
function t(){return UI[S.lang];}
function header(){
 const u=t();
 const stepTxt=S.step>=1&&S.step<=5?u.step(S.step):"";
 return `<div class="top"><button class="back" data-act="back" ${S.step===0?"hidden":""}>‹ ${esc(u.back)}</button><span class="step">${esc(stepTxt)}</span>
 <div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="${S.lang==="en"}">EN</button><button data-lang="km" aria-pressed="${S.lang==="km"}" lang="km">ខ្មែរ</button></div></div>`;
}
function render(){
 document.documentElement.lang=S.lang==="km"?"km":"en";
 const u=t();let h=header();
 if(S.step===0){
  h+=`<div class="hero">${LOTUS}<h1>Khmer Mystic</h1><p class="tag">${esc(u.tag)}</p></div>
  <p class="label">${esc(u.chooseLang)}</p>
  <div class="langpick"><button data-lang="en" aria-pressed="${S.lang==="en"}">English</button><button data-lang="km" aria-pressed="${S.lang==="km"}" lang="km">ភាសាខ្មែរ</button></div>
  <button class="primary" data-act="go" data-to="1">${esc(u.start)}</button>
  <p class="proto">${esc(u.proto)}</p>`;
 }else if(S.step===1){
  h+=`<h2>${esc(u.zTitle)}</h2><p class="hint">${esc(u.zHint)}</p><div class="zgrid">`+
  ZOD.map((z,i)=>`<button data-z="${i}" aria-pressed="${S.z===i}"><span class="em" aria-hidden="true">${z[3]}</span><span class="n">${esc(S.lang==="km"?z[2]:z[1])}</span><span class="s">${esc(S.lang==="km"?z[1]:z[2])}</span></button>`).join("")+`</div>`;
 }else if(S.step===2){
  if(S.topic===null){
   h+=`<h2>${esc(u.topicTitle)}</h2><div class="list" style="margin-top:16px">`+
   TOPICS.map((tp,i)=>`<button data-topic="${i}"><span>${esc(S.lang==="km"?tp.km:tp.en)}</span><span class="chev" aria-hidden="true">›</span></button>`).join("")+`</div>`;
  }else{
   const tp=TOPICS[S.topic];
   h+=`<h2>${esc(u.qTitle)}</h2><p class="hint">${esc(S.lang==="km"?tp.km:tp.en)}</p><div class="list">`+
   tp.q.map((q,i)=>`<button data-q="${i}" aria-pressed="${S.q===i}"><span>${esc(S.lang==="km"?q[1]:q[0])}</span></button>`).join("")+`</div>`;
  }
 }else if(S.step===3){
  h+=`<h2>${esc(u.tTitle)}</h2><p class="hint">${esc(u.tHint)}</p><div class="tgrid">`+
  u.times.map((x,i)=>`<button data-time="${i}" aria-pressed="${S.time===i}"><div class="n">${esc(x[0])}</div><div class="s">${esc(x[1])}</div></button>`).join("")+`</div>`;
 }else if(S.step===4){
  h+=`<h2>${esc(u.dTitle)}</h2><p class="hint">${esc(u.dHint)}</p>`;
  if(!S.cards){
   h+=`<div class="deck" id="deck"><div class="cb">${BACK}</div><div class="cb" style="transform:rotate(-4deg)">${BACK}</div><div class="cb" style="transform:rotate(3deg)">${BACK}</div></div>
   <button class="primary" data-act="draw">${esc(u.draw)}</button>`;
  }else{
   const all=S.flipped.every(Boolean);
   h+=`<div class="slots">`+S.cards.map((c,i)=>`<div class="slot"><button class="flip ${S.flipped[i]?"open":""}" data-flip="${i}" ${S.flipped[i]?"disabled":""} aria-label="${esc(u.pos[i])}${S.flipped[i]?": "+esc(cardName(c)):""}"><div class="inner"><div class="side"><div class="cb">${BACK}</div></div><div class="side front">${face(c)}</div></div></button><span class="pos">${esc(u.pos[i])}</span></div>`).join("")+`</div>
   <p class="tapnote">${all?"":esc(u.tap)}</p>
   <div class="foot"><button class="primary" data-act="go" data-to="5" ${all?"":"disabled"}>${esc(u.see)}</button></div>`;
  }
 }else if(S.step===5){
  const r=buildReading();
  h+=`<h2>${esc(u.rTitle)}</h2><div class="mini">`+S.cards.map((c,i)=>`<div>${face(c)}<div class="pos">${esc(u.pos[i])}</div></div>`).join("")+`</div>
  <div class="reading"><p class="lead">${r.open}</p><p>${r.str}</p><p class="cardp">${r.pre}</p><p class="cardp">${r.cha}</p><p class="cardp">${r.out}</p><p class="theme">${r.theme}</p><p>${r.adv}</p><p>${r.close}</p><p class="disc">${r.disc}</p></div>
  <button class="primary" data-act="again">${esc(u.again)}</button><button class="ghost" data-act="restart">${esc(u.restart)}</button>`;
 }
 app.innerHTML=h;
}

function go(n){S.step=n;render();window.scrollTo(0,0);}
app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.lang){S.lang=b.dataset.lang;try{localStorage.setItem("km-lang",S.lang);}catch(err){}render();return;}
 if(b.dataset.z!==undefined){S.z=+b.dataset.z;go(2);return;}
 if(b.dataset.topic!==undefined){S.topic=+b.dataset.topic;S.q=null;render();window.scrollTo(0,0);return;}
 if(b.dataset.q!==undefined){S.q=+b.dataset.q;go(3);return;}
 if(b.dataset.time!==undefined){S.time=+b.dataset.time;S.cards=null;S.flipped=[false,false,false];go(4);return;}
 if(b.dataset.flip!==undefined){const i=+b.dataset.flip;S.flipped[i]=true;const el=b;el.classList.add("open");el.disabled=true;
  setTimeout(render,matchMedia("(prefers-reduced-motion: reduce)").matches?0:720);return;}
 const a=b.dataset.act;
 if(a==="go"){go(+b.dataset.to);return;}
 if(a==="draw"){
  const deck=document.getElementById("deck");
  const pick=()=>{const idx=new Set();while(idx.size<3)idx.add(Math.floor(Math.random()*DECK.length));S.cards=[...idx].map(i=>DECK[i]);S.flipped=[false,false,false];render();};
  if(deck&&!matchMedia("(prefers-reduced-motion: reduce)").matches){deck.classList.add("shuffle");b.disabled=true;setTimeout(pick,950);}else pick();
  return;}
 if(a==="again"){S.topic=null;S.q=null;S.time=null;S.cards=null;go(2);return;}
 if(a==="restart"){Object.assign(S,{z:null,topic:null,q:null,time:null,cards:null,flipped:[false,false,false]});go(0);return;}
 if(a==="back"){
  if(S.step===2&&S.topic!==null){S.topic=null;render();return;}
  if(S.step===5){S.step=4;render();return;}
  if(S.step===4){S.cards=null;S.flipped=[false,false,false];}
  if(S.step===3){go(2);return;}
  go(Math.max(0,S.step-1));return;}
});
render();
})();
</script>
</body>
</html>
